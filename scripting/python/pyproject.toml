[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mptscript"
version = "0.1.0"
description = "Python scripting interface for OpenMPT's sound engine: compose, edit, save and render tracker modules from code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest", "numpy"]

[project.scripts]
mptscript = "mptscript.__main__:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["mptscript"]
editable.rebuild = false

[tool.pytest.ini_options]
testpaths = ["tests"]
